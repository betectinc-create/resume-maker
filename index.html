<style>body{font-family:'Noto Sans JP',sans-serif;margin:0;-webkit-font-smoothing:antialiased;letter-spacing:0.01em;}
    *{box-sizing:border-box;}
    input,select,textarea{font-family:inherit;}
    .glass{backdrop-filter:blur(20px);background:rgba(255,255,255,0.85);}
    .hc-orange{border-left:4px solid #E87830;padding-left:12px;}
    .focus-orange:focus{outline:none!important;border-color:#E87830!important;box-shadow:0 0 0 3px rgba(232,120,48,0.25)!important;}
    .header-logo{height:18px;}
    .header-title{font-size:11px;line-height:1.2;}
    @media(min-width:640px){.header-logo{height:24px;}.header-title{font-size:14px;}}
    .lc-tight{font-size:11px!important;white-space:nowrap;}
    .print-resume{display:none;}
    /* PDFはA4比率の固定サイズ枠に描画する（入力量でレイアウトが変わらない） */
    .pdf-page{width:760px;height:1116px;overflow:hidden;background:#fff;padding:0 86px;}
    /* 罫線は右下だけに引く。四辺に引くと隣接セルで二重に描かれて太くなるため */
    .print-resume table{border:2px solid #000;}
    .print-resume td{border-right:0.8px solid #000;border-bottom:0.8px solid #000;}
    .print-resume tr td:last-child{border-right:none;}
    .print-resume tr:last-child td{border-bottom:none;}
    #pdfHost{position:fixed;left:-20000px;top:0;display:none;z-index:-1;}
    #pdfHost .print-resume{display:block!important;}
    @page{size:A4;margin:10mm;}
    @media print{
      .noprint{display:none!important;}
      header,footer{display:none!important;}
      #pdfHost{position:static!important;left:auto!important;display:block!important;}
      .pdf-page{height:auto!important;}
      .print-resume{display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .print-resume,.print-resume *{overflow-wrap:anywhere;word-break:break-word;}
      .print-resume table{table-layout:fixed;width:100%;}
      .print-resume tr{break-inside:avoid;page-break-inside:avoid;}
      .print-resume img{max-width:100%;}
      html,body{background:#fff!important;margin:0;padding:0;}
    }</style>

// o.auto=true のときは行送りを既定のまま（＝ラベル側の段落と同じ組み方）にして、上下位置を揃える。
// 行数を計算で押さえたい長文欄だけ行送りを固定する。
const xpara=function(text,sz,opt){var o=opt||{};
  var sp=o.auto?'':'<w:snapToGrid w:val="0"/><w:spacing w:before="0" w:after="0" w:line="'+(o.line||Math.round(sz*LINEF))+'" w:lineRule="exact"/>';
  var pr='<w:pPr><w:widowControl w:val="0"/><w:wordWrap w:val="1"/><w:overflowPunct w:val="0"/>'+sp+'<w:jc w:val="'+(o.jc||"left")+'"/><w:rPr>'+WFONT+(o.bold?'<w:b/>':'')+'<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/></w:rPr></w:pPr>';
  return '<w:p>'+pr+xrun(text,sz,o.bold)+'</w:p>';};
const rowsOf=function(t){return t.match(/<w:tr[ >][\s\S]*?<\/w:tr>/g)||[];};
// 表の先頭セルの段落に改ページ指定を入れる（空段落を足さずに改ページできる＝空白ページが出ない）
const brkBefore=function(r){return eachCell(r,0,function(tc){
  var ps=tc.search(/<w:p[ >]/);if(ps===-1)return tc;
  var pe=tc.indexOf(">",ps)+1;var rest=tc.substring(pe);
  if(rest.indexOf("<w:pPr>")===0){
    var body=rest.substring(7);
    var st=body.match(/^<w:pStyle[^>]*\/>/);
    return tc.substring(0,pe)+"<w:pPr>"+(st?st[0]:"")+"<w:pageBreakBefore/>"+(st?body.substring(st[0].length):body);
  }
  return tc.substring(0,pe)+"<w:pPr><w:pageBreakBefore/></w:pPr>"+rest;
});};
const setH=function(r,h){var tag='<w:trHeight w:hRule="exact" w:val="'+h+'"/>';if(/<w:trHeight[^>]*\/>/.test(r))return r.replace(/<w:trHeight[^>]*\/>/,tag);if(r.indexOf("<w:trPr>")!==-1)return r.replace("<w:trPr>","<w:trPr>"+tag);return r.replace(/^(<w:tr[^>]*>)/,"$1<w:trPr>"+tag+"</w:trPr>");};
const eachCell=function(r,ci,fn){var i=0,n=0;while(true){var s=r.indexOf("<w:tc>",i);if(s===-1)return r;var e=r.indexOf("</w:tc>",s)+7;if(n===ci)return r.substring(0,s)+fn(r.substring(s,e))+r.substring(e);n++;i=e;}};
const putCell=function(r,ci,body){return eachCell(r,ci,function(tc){var ps=tc.search(/<w:p[ >]/);if(ps===-1)return tc;var pe=tc.lastIndexOf("</w:p>")+6;return tc.substring(0,ps)+body+tc.substring(pe);});};
const vMerge=function(r,ci,start){var tag=start?'<w:vMerge w:val="restart"/>':'<w:vMerge/>';return eachCell(r,ci,function(tc){if(tc.indexOf("<w:vMerge")!==-1)return tc.replace(/<w:vMerge[^>]*\/>/,tag);if(tc.indexOf("<w:gridSpan")!==-1)return tc.replace(/(<w:gridSpan[^>]*\/>)/,"$1"+tag);if(tc.indexOf("<w:tcW")!==-1)return tc.replace(/(<w:tcW[^>]*\/>)/,"$1"+tag);return tc;});};
// セルの罫線を上書きする（テンプレートは自己PR欄の内側罫線をnilにしているため、
// 途中に見出し行を差し込むと区切り線が無く1つの枠に見えてしまう）
const setBorders=function(r,ci,spec){return eachCell(r,ci,function(tc){
  var b="<w:tcBorders>"+spec+"</w:tcBorders>";
  if(/<w:tcBorders>[\s\S]*?<\/w:tcBorders>/.test(tc))return tc.replace(/<w:tcBorders>[\s\S]*?<\/w:tcBorders>/,b);
  if(tc.indexOf("<w:tcW")!==-1)return tc.replace(/(<w:tcW[^>]*\/>)/,"$1"+b);
  return tc;
});};
const RULE='<w:top w:val="single" w:sz="6" w:space="0" w:color="auto"/><w:bottom w:val="single" w:sz="6" w:space="0" w:color="auto"/>';
const putTbl=function(xml,marker,fn){var p=xml.indexOf(marker);if(p===-1)return xml;var st=xml.lastIndexOf("<w:tbl>",p);var en=xml.indexOf("</w:tbl>",p)+8;if(st===-1||en<st)return xml;return xml.substring(0,st)+fn(xml.substring(st,en))+xml.substring(en);};
// 指定の幅×高さ(px)に収まる最大のフォントサイズ(px)を返す（PDF側のレイアウト固定用）
const fitPx=function(text,wPx,hPx,base,min){var t=String(text||"");if(!t)return base;for(var s=base;s>min;s--){var per=Math.max(1,Math.floor(wPx/s));var ln=0;t.split(/\r?\n/).forEach(function(l){ln+=Math.max(1,Math.ceil(l.length/per));});if(ln*s*1.4<=hPx-6)return s;}return min;};
// 指定の幅×高さ(twips)に収まる最大の文字サイズ(half-point)を返す
const fitSz=function(text,wTw,hTw,base,min){var t=String(text||"");if(!t)return base;for(var sz=base;sz>min;sz-=2){var per=Math.max(1,Math.floor((wTw-260)/(sz*10)));var ln=0;t.split(/\r?\n/).forEach(function(s){ln+=Math.max(1,Math.ceil(s.length/per));});ln=Math.ceil(ln*1.25);if(ln*Math.round(sz*LINEF)<=hTw-260)return sz;}return min;};

// 暗号化キーの導出（UID + 固定salt から AES-GCM 256bit キーを生成）
const deriveKey=async function(uid){
  var enc=new TextEncoder();
  var keyMaterial=await crypto.subtle.importKey("raw",enc.encode(uid+"_connect_resume_salt_2024"),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:enc.encode("connect-resume"),iterations:100000,hash:"SHA-256"},
    keyMaterial,
    {name:"AES-GCM",length:256},
    false,
    ["encrypt","decrypt"]
  );
};
// 暗号化：JSON → AES-GCM → Base64
const encryptData=async function(key,data){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var enc=new TextEncoder();
  var encrypted=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(JSON.stringify(data)));
  var combined=new Uint8Array(iv.length+new Uint8Array(encrypted).length);
  combined.set(iv);
  combined.set(new Uint8Array(encrypted),iv.length);
  return btoa(String.fromCharCode.apply(null,combined));
};
// 復号：Base64 → AES-GCM → JSON
const decryptData=async function(key,base64){
  var combined=Uint8Array.from(atob(base64),function(c){return c.charCodeAt(0);});
  var iv=combined.slice(0,12);
  var data=combined.slice(12);
  var decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,data);
  return JSON.parse(new TextDecoder().decode(decrypted));
};
// 一覧の取得。並び替え用インデックスが無い環境でも動くよう、失敗時は並び替え無しで取り直す
const fetchCloudSaves=async function(uid){
  var snap;
  try{
    snap=await fbDb.collection("resumes").where("uid","==",uid).orderBy("updatedAt","desc").get();
  }catch(e){
    snap=await fbDb.collection("resumes").where("uid","==",uid).get();
  }
  var docs=[];snap.forEach(function(d){docs.push({id:d.id,...d.data()});});
  docs.sort(function(a,b){return ((b.updatedAt&&b.updatedAt.seconds)||0)-((a.updatedAt&&a.updatedAt.seconds)||0);});
  return docs;
};
const saveToCloud=async function(){
  if(!user){tt("ログインしてください");return;}
  // 保存と一覧取得は分けて扱う。一覧の取得に失敗しても保存自体は成功しているため
  try{
    var key=await deriveKey(user.uid);
    // 写真も含めて保存する。Firestoreの1ドキュメント上限は1MBなので、
    // 写真が大きい場合のみ除外して本文だけでも保存できるようにする
    var payload={...f};
    var encryptedData=await encryptData(key,payload);
    if(JSON.stringify(encryptedData).length>900000){
      payload={...f,photoPreview:null};
      encryptedData=await encryptData(key,payload);
      tt("写真が大きいため写真以外を保存します");
    }
    var data={uid:user.uid,name:f.name||"無題",encryptedData:encryptedData,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
    await fbDb.collection("resumes").add(data);
  }catch(e){
    tt(e.code==="permission-denied"?"保存できませんでした（アクセス権限）":"保存エラー: "+(e.code||e.message));
    return;
  }
  tt("暗号化して保存しました");
  try{setCloudSaves(await fetchCloudSaves(user.uid));}catch(e2){console.log("一覧取得エラー:",e2.code||e2.message);}
};
const loadFromCloud=async function(doc){
  try{
    // 暗号化前(formData)に保存された古いデータも読めるようにする
    var d=doc.encryptedData?await decryptData(await deriveKey(user.uid),doc.encryptedData):doc.formData;
    if(!d){tt("データが見つかりません");return;}
    setF({...INIT,...d});setStep(0);setPg("form");tt("読み込みました");
  }catch(e){tt("読み込みエラー: "+(e.code||e.message));}
};

// PDFはブラウザの印刷機能を使わず自前で生成する（日付・URL・タイトルのヘッダー/フッターが付かない）
const generatePdf=async function(){
  var H2C=window.html2canvas,JSP=window.jspdf&&window.jspdf.jsPDF;
  var host=document.getElementById("pdfHost");
  if(!H2C||!JSP||!host){
    tt("PDF機能を読み込めませんでした。印刷画面を開きます");
    try{window.print();}catch(er){tt("Safari/Chromeでお試しください");}
    return;
  }
  setGenerating(true);
  try{
    host.style.display="block";
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    var pdf=new JSP({unit:"mm",format:"a4",orientation:"portrait"});
    var ids=["pdfPage1","pdfPage2"];
    for(var i=0;i<ids.length;i++){
      var el=document.getElementById(ids[i]);
      if(!el)continue;
      var cv=await H2C(el,{scale:3,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:el.offsetWidth});
      if(i>0)pdf.addPage();
      pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",12,12,186,273);
    }
    pdf.save("履歴書_"+(f.name||"無題")+".pdf");
    tt("PDFを保存しました");
  }catch(er){tt("PDF作成エラー: "+er.message);}
  host.style.display="none";
  setGenerating(false);
};
